[theme]
primaryColor = "#8b5cf6"
backgroundColor = "#0a0a0f"
secondaryBackgroundColor = "#13131a"
textColor = "#f5f5f7"
font = "sans serif"
base = "dark"

[server]
maxUploadSize = 15
enableXsrfProtection = true
enableCORS = false
headless = true

[browser]
gatherUsageStats = false

[runner]
magicEnabled = true
fastReruns = true

[client]
showErrorDetails = true
toolbarMode = "minimal"
